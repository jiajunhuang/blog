<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <!-- iOS -->
    <meta name="apple-mobile-web-app-title" content="Jiajun的技术笔记">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-status-bar-style" content="#faf7f2">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <!-- Android -->
    <link rel="shortcut icon" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#faf7f2">

    <!-- 规范链接 -->
    <link rel="canonical" href="https://jiajunhuang.com{{ .urlPath }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{{ if .isIndex }}website{{ else }}article{{ end }}">
    <meta property="og:url" content="https://jiajunhuang.com{{ .urlPath }}">
    <meta property="og:title" content="{{ if .title }}{{ .title }}{{ else }}Jiajun的技术笔记{{ end }}">
    <meta property="og:description" content="{{ if .description }}{{ .description }}{{ else }}Jiajun的个人技术博客，分享编程、技术和生活{{ end }}">
    <meta property="og:image" content="https://jiajunhuang.com/static/apple-touch-icon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://jiajunhuang.com{{ .urlPath }}">
    <meta property="twitter:title" content="{{ if .title }}{{ .title }}{{ else }}Jiajun的技术笔记{{ end }}">
    <meta property="twitter:description" content="{{ if .description }}{{ .description }}{{ else }}Jiajun的个人技术博客，分享编程、技术和生活{{ end }}">
    <meta property="twitter:image" content="https://jiajunhuang.com/static/apple-touch-icon.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" integrity="sha512-rt/SrQ4UNIaGfDyEXZtNcyWvQeOq0QLygHluFQcSjaGB04IxWhal71tKuzP6K8eYXYB6vJV4pHkXcmFGGQ1/0w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/static/styles.css?v=20261005-warm">
    <link rel="alternate" type="application/rss+xml" title="RSS" href="https://jiajunhuang.com/rss">

    <!-- 添加 Bootstrap 必需的 JavaScript 依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js" integrity="sha512-TPh2Oxlg1zp+kz3nFA0C5vVC6leG/6mm1z9+mA81MI5eaUVqasPLO8Cuk4gMF4gUfP5etR73rgU/8PNMsSesoQ==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js" integrity="sha512-7rusk8kGPFynZWu26OKbTeI+QPoYchtxsmPeBqkHIEXJxeun4yJ4ISYe7C6sz9wdxeE1Gk3VxsIWgCZTc+vX3g==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>

    <!-- meta -->
    {{ if .keywords }}
    <meta name="keywords" content="{{ .keywords }}">
    {{ end }}
    {{ if .description }}
    <meta name="description" content="{{ .description }}">
    {{ else }}
    <meta name="description" content="Jiajun的个人技术博客，分享编程、技术和生活">
    {{ end }}

    <title>
        {{ if .title }}{{ .title }} - {{ end }}{{ if .subtitle }}{{ .subtitle }} - {{ end }}Jiajun的技术笔记
    </title>
    <script async src="https://stats.jiajunhuang.com/script.js" data-website-id="e81e121a-6756-4d07-b635-172d345abbb8"></script>
</head>

<body{{ if .isBlogApp }} class="blog-app"{{ end }}>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <div class="container site-shell">
        {{ if not .isBlogApp }}
        <header class="site-header">
            <a class="site-brand" href="/" aria-label="Jiajun的技术笔记，首页"><span class="brand-mark" aria-hidden="true">J.</span><span>Jiajun<span class="brand-caption">的技术笔记</span></span></a>
            <nav class="site-nav" aria-label="主导航">
                <a href="/archive">归档</a>
                <a href="/sharing">分享</a>
                <a href="/notes">随想</a>
                <a href="/friends">友链</a>
                <details class="nav-tools">
                    <summary>工具</summary>
                    <div class="tools-menu">
                        <a href="https://tiku.jiajunhuang.com">面试题库</a>
                        <a href="https://jiajunhuang.com/page/index.md">幻灯片</a>
                    </div>
                </details>
                <a href="/aboutme">关于</a>
                <a class="nav-language" href="https://blog.jiajunhuang.com" lang="en" aria-label="English blog">EN ↗</a>
            </nav>
            <form class="site-search" action="/search" method="POST" role="search">
                <input id="site-search" type="search" placeholder="搜索笔记…" name="search" aria-label="搜索笔记" required>
                <button type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
            </form>
        </header>
        {{ end }}

        <main id="main-content" class="site-main" tabindex="-1">
            <div id="body" class="content-layout">
                <div class="primary-content">
